# Production stack for one Linux VPS:
#   cp .env.production.example .env && edit it
#   docker compose up -d --build
#   docker compose exec app npm run create-admin      (with ADMIN_EMAIL / ADMIN_PASSWORD in .env)
# Optional demo fleet (no real servers needed):
#   docker compose --profile demo up -d
#
# The app binds to 127.0.0.1:5000 — point your host NGINX at it.
# MongoDB and Prometheus are internal-only and never exposed.

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    env_file: .env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-changeme}@mongo:27017/server_management_platform?authSource=admin}
      PROM_URL: http://prometheus:9090
    depends_on:
      mongo:
        condition: service_healthy
      prometheus:
        condition: service_started

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-remote-write-receiver
    volumes:
      - ./telemetry/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # Simulated fleet for demos/testing: pushes metrics + heartbeats for every server in the inventory.
  simulator:
    profiles: ["demo"]
    build: .
    restart: unless-stopped
    command: ["node", "scripts/simulate-fleet.js"]
    healthcheck:
      disable: true # the image's health check targets the API, which this container doesn't run
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-changeme}@mongo:27017/server_management_platform?authSource=admin}
      API_URL: http://app:5000
      PROM_URL: http://prometheus:9090
    depends_on:
      - app

volumes:
  mongo-data:
  prometheus-data:
