# Platform Prometheus — metrics arrive by remote_write through the API's /ingest/metrics
# gateway (agent-token auth, server_id label enforced). Nothing is scraped from customer hosts.
#
# Run with:
#   --web.enable-remote-write-receiver
#   --storage.tsdb.retention.time=30d
#   --web.listen-address=127.0.0.1:9090   (never expose publicly)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring only
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
